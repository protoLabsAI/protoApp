name: CI

# Bootstrap CI gate for fleet compliance (required status check for branch
# protection). Frontend typecheck + lint today; the full Rust/Metal + iOS
# build lands as part of the iPad pivot (milestone M2 — iOS-in-CI).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: frontend (typecheck + lint)
    runs-on: ubuntu-latest # workspace-config: allow-hosted-runner bootstrap gate; owned-runner + full Rust/iOS CI is iPad-pivot milestone M2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

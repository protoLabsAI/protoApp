# Spike: verify that `llama-cpp-sys-2 = 0.1.143` can cross-compile for
# iOS (aarch64-apple-ios) with Metal shader support (GGML_USE_METAL).
#
# This job creates a minimal scratch crate, runs `cargo build` for the
# iOS target on a macOS runner, then inspects the resulting staticlib
# for embedded Metal shader blobs.
#
# Output: docs/spikes/llama-ios.md (go / no-go decision).
#
# Trigger: manually from Actions tab, or on-demand via workflow_dispatch.
# Not on the default CI gate — this is a one-time spike, not a regression
# check.

name: iOS llama.cpp spike

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ios-llama-spike.yml
      - crates/protolabs-voice-core/Cargo.toml
      - Cargo.toml

permissions:
  contents: read

jobs:
  ios-spike:
    name: cargo build --target aarch64-apple-ios (Metal)
    runs-on: macos-15 # workspace-config: allow-hosted-runner one-time iOS spike; owned macOS runner is iPad-pivot milestone M2

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-ios

      - name: Install cmake (required by llama-cpp-sys-2 build script)
        run: brew install cmake

      - name: Create scratch crate for iOS spike
        run: |
          mkdir -p /tmp/ios-llama-spike/src
          cat > /tmp/ios-llama-spike/Cargo.toml <<'EOF'
          [package]
          name = "ios-llama-spike"
          version = "0.1.0"
          edition = "2021"

          # staticlib, not a bin: iOS has no host executable-link path on the
          # runner, so a bin crate fails at the final link even when the real
          # question — does llama-cpp-sys-2's Metal build cross-compile —
          # already succeeded. A staticlib stops after compiling + archiving
          # the sys crate, which is exactly what we want to prove.
          [lib]
          crate-type = ["staticlib"]

          [dependencies]
          # Pull in the workspace-pinned sys crate directly (avoids pulling
          # the full high-level llama-cpp-2 which may have desktop-only deps).
          llama-cpp-sys-2 = { version = "=0.1.143", features = ["metal"] }
          EOF
          cat > /tmp/ios-llama-spike/src/lib.rs <<'EOF'
          // Depending on llama-cpp-sys-2 runs its build.rs, which cmake-builds
          // llama.cpp's Metal backend for aarch64-apple-ios — exactly the
          // thing under test. `use ... as _` keeps the dep linked without
          // touching version-specific symbols (so the spike can't fail for
          // the wrong reason). A clean `cargo build` IS the GO signal.
          use llama_cpp_sys_2 as _;
          EOF

      - name: Build scratch crate for iOS target
        env:
          # Force Metal backend — required for iOS GPU inference.
          # The llama-cpp-sys-2 build script respects this to set
          # -DGGML_METAL=ON in the cmake invocation.
          LLAMA_CPP_SYS_2_CXXSTANDARD: "17"
          # Suppress OpenMP on iOS (not available in the iOS SDK).
          OPENMP_ROOT: ""
        run: |
          cd /tmp/ios-llama-spike
          cargo build --target aarch64-apple-ios --release 2>&1 | tee /tmp/ios-spike-build.log

      # The GO signal is the build step above exiting 0 — that proves
      # llama-cpp-sys-2's cmake/Metal build cross-compiled for iOS. This
      # step is INFORMATIONAL ONLY (never fails the job): it locates the
      # compiled archives wherever cargo put them and reports Metal markers.
      - name: Inspect iOS artifacts (informational)
        if: always()
        run: |
          ROOT=/tmp/ios-llama-spike/target/aarch64-apple-ios/release
          echo "=== all .a archives under the iOS target ==="
          # The sys crate's native lib lands in build/<hash>/out/, not deps/.
          find "$ROOT" -name '*.a' -print -exec sh -c 'echo "  size: $(du -h "$1" | cut -f1)"' _ {} \; 2>/dev/null | head -40

          LIB=$(find "$ROOT" \( -name 'libllama*.a' -o -name 'libggml*.a' \) | head -1)
          if [ -n "$LIB" ]; then
            echo ""
            echo "=== Metal markers in $LIB ==="
            nm "$LIB" 2>/dev/null | grep -i metal | head -10 || echo "(no Metal symbols via nm)"
            MTL=$(strings "$LIB" 2>/dev/null | grep -c -i "MTLDevice\|MTLBuffer\|ggml_metal\|kernel" || true)
            echo "Metal-related strings: $MTL"
          else
            echo "(no llama/ggml archive located — build still succeeded; see Metal cmake check)"
          fi

      - name: Check build log for Metal cmake flags
        run: |
          echo "=== CMake Metal configuration from build log ==="
          grep -i "GGML_METAL\|metal\|Metal" /tmp/ios-spike-build.log | head -20 || \
            echo "No Metal references in build log"

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-llama-spike-build-log
          path: /tmp/ios-spike-build.log
          retention-days: 14

# Spike: verify that `llama-cpp-sys-2 = 0.1.143` can cross-compile for
# iOS (aarch64-apple-ios) with Metal shader support (GGML_USE_METAL).
#
# This job creates a minimal scratch crate, runs `cargo build` for the
# iOS target on a macOS runner, then inspects the resulting staticlib
# for embedded Metal shader blobs.
#
# Output: docs/spikes/llama-ios.md (go / no-go decision).
#
# Trigger: manually from Actions tab, or on-demand via workflow_dispatch.
# Not on the default CI gate — this is a one-time spike, not a regression
# check.

name: iOS llama.cpp spike

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ios-llama-spike.yml
      - crates/protolabs-voice-core/Cargo.toml
      - Cargo.toml

permissions:
  contents: read

jobs:
  ios-spike:
    name: cargo build --target aarch64-apple-ios (Metal)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install cmake (required by llama-cpp-sys-2 build script)
        run: brew install cmake

      - name: Create scratch crate for iOS spike
        run: |
          mkdir -p /tmp/ios-llama-spike
          cat > /tmp/ios-llama-spike/Cargo.toml <<'EOF'
          [package]
          name = "ios-llama-spike"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          # Pull in the workspace-pinned sys crate directly (avoids pulling
          # the full high-level llama-cpp-2 which may have desktop-only deps).
          llama-cpp-sys-2 = { version = "=0.1.143", features = ["metal"] }
          EOF
          cat > /tmp/ios-llama-spike/src/main.rs <<'EOF'
          fn main() {
              // Verify the Metal shader blob symbol exists at compile time.
              // llama-cpp-sys-2 with GGML_USE_METAL embeds the compiled
              // Metal library as a C string constant. The symbol name
              // varies by version — we check via a runtime log instead.
              println!("llama-cpp-sys-2 linked successfully for iOS target");
              println!("Metal support: {}", llama_cpp_sys_2::GGML_USE_METAL);
          }
          EOF

      - name: Build scratch crate for iOS target
        env:
          # Force Metal backend — required for iOS GPU inference.
          # The llama-cpp-sys-2 build script respects this to set
          # -DGGML_METAL=ON in the cmake invocation.
          LLAMA_CPP_SYS_2_CXXSTANDARD: "17"
          # Suppress OpenMP on iOS (not available in the iOS SDK).
          OPENMP_ROOT: ""
        run: |
          cd /tmp/ios-llama-spike
          cargo build --target aarch64-apple-ios --release 2>&1 | tee /tmp/ios-spike-build.log

      - name: Verify Metal shaders in staticlib
        run: |
          # Find the built staticlib
          LIB=$(find /tmp/ios-llama-spike/target/aarch64-apple-ios/release/deps \
                -name 'llama*.a' | head -1)

          if [ -z "$LIB" ]; then
            echo "ERROR: no llama staticlib found"
            exit 1
          fi

          echo "Found staticlib: $LIB"
          echo "File size: $(du -h "$LIB" | cut -f1)"

          # Check for Metal-related symbols
          echo ""
          echo "=== Metal symbol check ==="
          nm "$LIB" 2>/dev/null | grep -i metal | head -20 || \
            echo "(nm found no Metal symbols, checking strings...)"

          # Also check via strings for the embedded Metal shader blob
          echo ""
          echo "=== Embedded Metal shader check ==="
          STRINGS_COUNT=$(strings "$LIB" 2>/dev/null | grep -c -i "MTLDevice\|MTLBuffer\|metal\|kernel" || true)
          echo "Metal-related strings found: $STRINGS_COUNT"

          if [ "$STRINGS_COUNT" -gt 0 ]; then
            echo "PASS: Metal shader blobs detected in staticlib"
            strings "$LIB" 2>/dev/null | grep -i "MTLDevice\|MTLBuffer\|metal\|kernel" | head -10
          else
            echo "WARN: No Metal symbols/strings found — may still be OK if shaders"
            echo "      are embedded as data blobs without recognizable symbols."
            echo "      Check build log for -DGGML_METAL=ON confirmation."
          fi

      - name: Check build log for Metal cmake flags
        run: |
          echo "=== CMake Metal configuration from build log ==="
          grep -i "GGML_METAL\|metal\|Metal" /tmp/ios-spike-build.log | head -20 || \
            echo "No Metal references in build log"

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-llama-spike-build-log
          path: /tmp/ios-spike-build.log
          retention-days: 14
